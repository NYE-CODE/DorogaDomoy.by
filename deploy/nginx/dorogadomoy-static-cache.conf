# Подключается внутри server { } сайта doragadomoy.by.
# Имена в /assets/ содержат хеш сборки, поэтому их можно держать год.

location = /health {
    proxy_pass http://127.0.0.1:8000/health;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# OG + crawl-HTML для карточек, городов, блога и приютов (без полного SSR)
location ~ ^/(pet|shelter-pet|blog|shelters)/[^/]+/?$ {
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location ~ ^/(search|blog|shelters)/?$ {
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location ~ ^/city/[^/]+/?$ {

    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Личные/служебные SPA-маршруты: серверный noindex (не полагаемся только на JS).
# Важно: try_files ... /index.html; делает internal redirect и сбрасывает add_header.
# Отдаём файл напрямую: try_files /index.html =404;
location ^~ /admin {
    add_header X-Robots-Tag "noindex, nofollow" always;
    try_files /index.html =404;
}
location ^~ /profile {
    add_header X-Robots-Tag "noindex, nofollow" always;
