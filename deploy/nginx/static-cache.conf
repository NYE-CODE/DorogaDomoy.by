# Подключается внутри server { } сайта dorogadomoy.by.
# Имена в /assets/ содержат хеш сборки, поэтому их можно держать год.

location ^~ /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
}

location ^~ /hero/ {
    add_header Cache-Control "public, max-age=2592000" always;
    try_files $uri =404;
}

location = /logo.png {
    add_header Cache-Control "public, max-age=2592000" always;
    try_files $uri =404;
}
