# Пример замены «голого» SPA-fallback, чтобы неизвестные URL отдавали 404,
# а не index.html с кодом 200 (soft 404).
#
# В основном server { } сайта:
# 1) Оставьте include dorogadomoy-static-cache.conf
#    (pet/shelter-pet/blog/shelters/city + private X-Robots + кэш).
# 2) Удалите location / { try_files $uri $uri/ /index.html; }
# 3) Вставьте этот блок (или include этого файла).
#
# root / index должны указывать на каталог фронтенд-билда.

location = / {
    try_files /index.html =404;
}

# Публичные «плоские» маршруты SPA (списки; детали blog/shelters — на backend)
location ~ ^/(search|shelters|blog|terms|privacy|delete-account)/?$ {
    try_files /index.html =404;
}

# Прочие публичные вложенные SPA-маршруты
location ~ ^/(user|pet-profile)/[^/]+/?$ {
    try_files /index.html =404;
}

# Файлы из билда (robots.txt, sitemap.xml, гайды /poisk-…/, /najdennye-…/, ассеты).
# Неизвестные пути → настоящий 404, не дубль главной.
location / {
    try_files $uri $uri/ =404;
}

# Статическая 404 из public/404.html (попадает в билд)
error_page 404 /404.html;
location = /404.html {
    internal;
    add_header X-Robots-Tag "noindex, nofollow" always;
}
